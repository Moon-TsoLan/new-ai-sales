<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI-SALE · 智能销售预测系统</title>
    <!-- Font Awesome 6 (免费图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Inter 现代无衬线字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f5f7fb;
            height: 100vh;
            overflow: hidden;
            color: #1e293b;
        }

        /* 整体布局 */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.02);
        }

        /* ========= 左侧边栏 ========= */
        .sidebar {
            width: 280px;
            background: #fefefe;
            border-right: 1px solid #e9edf2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: width 0.25s ease-in-out;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 1px 0 8px rgba(0, 0, 0, 0.02);
        }

        /* 收起状态 */
        .sidebar.collapsed {
            width: 72px;
        }

        .sidebar.collapsed .sidebar-top .logo span,
        .sidebar.collapsed .new-chat-text,
        .sidebar.collapsed .history-item span,
        .sidebar.collapsed .user-info span,
        .sidebar.collapsed .sidebar-top .logo-name {
            display: none;
        }

        .sidebar.collapsed .history-item {
            justify-content: center;
            padding: 10px 0;
        }

        .sidebar.collapsed .history-item i {
            margin-right: 0;
            font-size: 1.3rem;
        }

        .sidebar.collapsed .new-chat-btn {
            justify-content: center;
            padding: 8px 0;
        }

        .sidebar.collapsed .user-info {
            justify-content: center;
            padding: 12px 0;
        }

        /* 侧边栏内部结构 */
        .sidebar-top {
            padding: 20px 16px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 第一行：Logo + 收起按钮 */
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 1.8rem;
            color: #3b82f6;
            background: #eef2ff;
            padding: 8px;
            border-radius: 14px;
        }

        .logo-name {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .collapse-btn {
            background: #f1f5f9;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            transition: all 0.2s;
        }

        .collapse-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        /* 新问卷按钮 */
        .new-chat-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            color: #1e293b;
        }

        .new-chat-btn i {
            font-size: 1.1rem;
            color: #3b82f6;
        }

        .new-chat-btn:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        /* 历史记录区域 */
        .history-section {
            flex: 1;
            overflow-y: auto;
            margin-top: 8px;
            padding: 0 12px 16px 12px;
        }

        .history-header {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            padding: 12px 8px 6px 8px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            color: #334155;
            font-size: 0.9rem;
        }

        .history-item i {
            width: 22px;
            font-size: 1rem;
            color: #5b6e8c;
        }

        .history-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #f1f5f9;
        }

        .history-item.active {
            background: #eef2ff;
            color: #2563eb;
        }

        /* 底部用户区 */
        .sidebar-bottom {
            padding: 16px;
            border-top: 1px solid #edf2f7;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 4px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-info i {
            font-size: 1.2rem;
            background: #eef2ff;
            padding: 6px;
            border-radius: 50%;
            color: #2563eb;
        }

        .user-info span {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s;
            margin-left: auto;
        }

        .logout-btn:hover {
            color: #ef4444;
        }

        /* ========= 右侧主内容 ========= */
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            padding: 2rem 2rem 3rem 2rem;
        }

        .content-wrapper {
            max-width: 880px;
            margin: 0 auto;
            width: 100%;
        }

        /* 问卷卡片 */
        .form-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.03), 0 2px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid #edf2f7;
            padding: 28px 32px;
            margin-bottom: 32px;
            transition: all 0.2s;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #334155;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
            background: #fefefe;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .upload-area {
            border: 1.5px dashed #cbd5e1;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafcff;
        }

        .upload-area:hover {
            border-color: #3b82f6;
            background: #f8fafc;
        }

        .upload-area i {
            font-size: 2rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .preview-img {
            margin-top: 16px;
            max-width: 100%;
            max-height: 140px;
            border-radius: 16px;
            display: none;
            object-fit: cover;
            border: 1px solid #e2e8f0;
        }

        .btn-submit {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(37,99,235,0.2);
        }

        /* 结果表格区域 */
        .result-section {
            margin-top: 12px;
            background: #ffffff;
            border-radius: 28px;
            border: 1px solid #edf2f7;
            overflow: hidden;
            transition: all 0.2s;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #f0f2f5;
        }

        .result-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #1e293b;
        }

        .metric-value {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0f172a;
        }

        /* 切换按钮组 */
        .toggle-group {
            display: flex;
            gap: 12px;
            padding: 20px 24px 12px 24px;
            border-bottom: 1px solid #edf2f7;
        }

        .toggle-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #334155;
        }

        .toggle-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 2px 6px rgba(59,130,246,0.3);
        }

        /* SHAP 图容器 */
        .shap-container {
            padding: 20px 24px 24px 24px;
            background: #ffffff;
        }

        canvas {
            width: 100%;
            height: auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .empty-placeholder {
            text-align: center;
            color: #94a3b8;
            padding: 48px 20px;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            margin-top: 32px;
            color: #94a3b8;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="logo-area">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <span class="logo-name">AI-SALE</span>
                </div>
                <button class="collapse-btn" id="collapseBtn">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <button class="new-chat-btn" id="newSurveyBtn">
                <i class="fas fa-plus-circle"></i>
                <span class="new-chat-text">开启新问卷</span>
            </button>
        </div>

        <div class="history-section">
            <div class="history-header">最近记录</div>
            <div class="history-list" id="historyList">
                <!-- 动态历史记录会通过js填充模拟数据 -->
            </div>
        </div>

        <div class="sidebar-bottom">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span>张明阳</span>
                <button class="logout-btn" id="logoutBtn" title="退出登录">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- 右侧主要内容 -->
    <main class="main-content">
        <div class="content-wrapper">
            <!-- 问卷卡片 -->
            <div class="form-card">
                <div class="form-title">
                    <i class="fas fa-clipboard-list" style="color:#3b82f6"></i> 
                    产品销售预测问卷
                </div>
                <div class="form-group">
                    <label>产品名称</label>
                    <input type="text" id="productName" placeholder="例：智能降噪无线耳机" />
                </div>
                <div class="form-group">
                    <label>产品描述</label>
                    <textarea rows="3" id="productDesc" placeholder="详细描述产品功能、目标人群、卖点..."></textarea>
                </div>
                <div class="form-group">
                    <label>产品图片</label>
                    <div class="upload-area" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p style="margin-top: 8px;">点击或拖拽上传图片</p>
                        <input type="file" id="imageUpload" accept="image/*" style="display: none;" />
                    </div>
                    <img id="previewImage" class="preview-img" alt="预览图">
                </div>
                <button class="btn-submit" id="submitBtn">
                    <i class="fas fa-chart-simple"></i> 生成预测报告
                </button>
            </div>

            <!-- 预测结果展示区（初始隐藏） -->
            <div id="resultArea" style="display: none;">
                <div class="result-section">
                    <table class="result-table">
                        <thead>
                            <tr><th>预测指标</th><th>数值</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>📈 预估月销量 (件)</td><td class="metric-value" id="predSales">--</td></tr>
                            <tr><td>💰 预估销售额 (万元)</td><td class="metric-value" id="predRevenue">--</td></tr>
                            <tr><td>🎯 置信区间 (95%)</td><td id="predInterval">--</td></tr>
                            <tr><td>⭐ 推荐指数</td><td id="recommend">--</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="result-section" style="margin-top: 20px;">
                    <div class="toggle-group">
                        <button class="toggle-btn active" data-model="regression">📊 回归结果</button>
                        <button class="toggle-btn" data-model="tree">🌲 树模型结果</button>
                    </div>
                    <div class="shap-container">
                        <canvas id="shapCanvas" width="700" height="280" style="width:100%; height:auto; max-width:700px; margin:0 auto; display:block;"></canvas>
                        <p style="text-align:center; font-size:0.75rem; margin-top:12px; color:#64748b;">
                            SHAP 特征重要性 (可解释性分析)
                        </p>
                    </div>
                </div>
            </div>
            <footer>AI-SALE · 基于多模态回归预测 + SHAP 可解释性</footer>
        </div>
    </main>
</div>

<script>
    // ----- 模拟历史记录数据 -----
    let historyData = [
        { id: 1, name: "AI 智能手环", sales: 15230, date: "2025-03-28" },
        { id: 2, name: "便携投影仪", sales: 8920, date: "2025-03-25" },
        { id: 3, name: "降噪睡眠耳塞", sales: 24700, date: "2025-03-22" },
        { id: 4, name: "无叶风扇", sales: 5600, date: "2025-03-18" }
    ];

    // 当前激活的模型类型: 'regression' 或 'tree'
    let currentModel = 'regression';
    // 当前展示的预测结果数据 (用于绘制SHAP)
    let currentPrediction = {
        sales: 0,
        revenue: 0,
        interval: "",
        recommend: ""
    };

    // 模拟的SHAP特征数据 (不同模型不同)
    const shapFeaturesRegression = [
        { name: "图像美学特征", value: 0.42 },
        { name: "文本情感分", value: 0.28 },
        { name: "关键词热度", value: 0.18 },
        { name: "价格区间编码", value: 0.07 },
        { name: "竞争密度", value: 0.05 }
    ];
    const shapFeaturesTree = [
        { name: "图像纹理特征", value: 0.35 },
        { name: "描述主题建模", value: 0.31 },
        { name: "品牌词向量", value: 0.22 },
        { name: "颜色分布", value: 0.08 },
        { name: "类目交互", value: 0.04 }
    ];

    // 根据产品名称/描述动态生成模拟预测 (简单模拟，展示交互)
    function generateMockPrediction(name, desc, hasImage) {
        let baseSales = 8000;
        if (name.length > 5) baseSales += 1200;
        if (desc.length > 20) baseSales += 1800;
        if (hasImage) baseSales += 2200;
        // 随机波动模拟
        const randomFactor = 0.8 + Math.random() * 0.7;
        let sales = Math.floor(baseSales * randomFactor);
        sales = Math.min(38000, Math.max(1200, sales));
        const revenue = (sales * 0.032).toFixed(1);
        const interval = `${Math.floor(sales*0.85)} - ${Math.floor(sales*1.12)}`;
        let recommend = "";
        if (sales > 20000) recommend = "🔥 强烈推荐";
        else if (sales > 10000) recommend = "⭐ 推荐";
        else recommend = "📌 潜力商品";
        return { sales, revenue, interval, recommend };
    }

    // 绘制SHAP条形图 (水平条形图)
    function drawShapChart(features, modelType) {
        const canvas = document.getElementById('shapCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        canvas.width = width;
        canvas.height = height;
        
        // 清空
        ctx.clearRect(0, 0, width, height);
        if (!features || features.length === 0) return;
        
        const margin = { left: 110, right: 60, top: 30, bottom: 30 };
        const chartWidth = width - margin.left - margin.right;
        const barHeight = (height - margin.top - margin.bottom) / features.length - 6;
        const maxVal = Math.max(...features.map(f => Math.abs(f.value)), 0.5);
        
        ctx.font = "12px 'Inter'";
        ctx.textBaseline = "middle";
        
        for (let i = 0; i < features.length; i++) {
            const feat = features[i];
            const barLength = (Math.abs(feat.value) / maxVal) * chartWidth;
            const y = margin.top + i * (barHeight + 8);
            const x = margin.left;
            // 正值蓝色，负值橙红 (这里值都是正模拟，但为了效果)
            ctx.fillStyle = feat.value >= 0 ? '#3b82f6' : '#f97316';
            ctx.fillRect(x, y, barLength, barHeight);
            ctx.fillStyle = '#1e293b';
            ctx.fillText(feat.name, x - 8, y + barHeight/2);
            ctx.fillStyle = '#475569';
            ctx.fillText(feat.value.toFixed(2), x + barLength + 6, y + barHeight/2);
        }
        // 标题
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 13px 'Inter'";
        ctx.fillText(`📊 SHAP 特征贡献 (${modelType === 'regression' ? '回归模型' : '树模型'})`, margin.left, 20);
    }

    // 刷新整个结果区域: 展示预测卡片 + 根据当前模型绘制SHAP
    function refreshResultDisplay(prediction, modelType) {
        document.getElementById('predSales').innerText = prediction.sales.toLocaleString();
        document.getElementById('predRevenue').innerText = prediction.revenue;
        document.getElementById('predInterval').innerText = prediction.interval;
        document.getElementById('recommend').innerHTML = prediction.recommend;
        
        const features = modelType === 'regression' ? shapFeaturesRegression : shapFeaturesTree;
        drawShapChart(features, modelType);
    }

    // 提交问卷 (模拟后端预测)
    function onSubmitPrediction() {
        const productName = document.getElementById('productName').value.trim();
        const productDesc = document.getElementById('productDesc').value.trim();
        const imageFile = document.getElementById('imageUpload').files[0];
        
        if (!productName) {
            alert("请填写产品名称");
            return;
        }
        if (!productDesc) {
            alert("请填写产品描述");
            return;
        }
        
        // 模拟加载效果
        const btn = document.getElementById('submitBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 分析中...';
        btn.disabled = true;
        
        setTimeout(() => {
            const hasImage = !!imageFile;
            const prediction = generateMockPrediction(productName, productDesc, hasImage);
            currentPrediction = prediction;
            
            // 显示结果区域
            const resultArea = document.getElementById('resultArea');
            resultArea.style.display = 'block';
            
            // 根据当前模型渲染
            refreshResultDisplay(prediction, currentModel);
            
            // 将本次预测加入历史记录 (前端模拟)
            const newHistory = {
                id: Date.now(),
                name: productName.length > 18 ? productName.slice(0,16)+"..." : productName,
                sales: prediction.sales,
                date: new Date().toISOString().slice(0,10)
            };
            historyData.unshift(newHistory);
            renderHistoryList();
            
            btn.innerHTML = originalHtml;
            btn.disabled = false;
            
            // 自动滚动到结果区域
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 900);
    }

    // 渲染历史记录列表
    function renderHistoryList() {
        const container = document.getElementById('historyList');
        if (!container) return;
        container.innerHTML = '';
        historyData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.setAttribute('data-id', item.id);
            div.innerHTML = `<i class="fas fa-file-alt"></i><span>${item.name} · ${item.sales.toLocaleString()}件</span>`;
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                // 点击历史记录，回填问卷并模拟预测（用历史的数据）
                document.getElementById('productName').value = item.name.replace('...', '');
                document.getElementById('productDesc').value = `历史产品：${item.name}，之前预测销量为${item.sales}件`;
                document.getElementById('imageUpload').value = '';
                document.getElementById('previewImage').style.display = 'none';
                // 自动提交预测
                onSubmitPrediction();
                // 高亮效果
                document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
            });
            container.appendChild(div);
        });
        if(historyData.length === 0){
            container.innerHTML = '<div style="padding:12px; color:#94a3b8; text-align:center;">暂无记录</div>';
        }
    }

    // 开启新问卷 (清空表单和结果)
    function resetSurvey() {
        document.getElementById('productName').value = '';
        document.getElementById('productDesc').value = '';
        document.getElementById('imageUpload').value = '';
        const preview = document.getElementById('previewImage');
        preview.style.display = 'none';
        preview.src = '';
        const resultArea = document.getElementById('resultArea');
        resultArea.style.display = 'none';
        // 重置toggle样式
        currentModel = 'regression';
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            if(btn.getAttribute('data-model') === 'regression') btn.classList.add('active');
            else btn.classList.remove('active');
        });
        // 可清除canvas
        const canvas = document.getElementById('shapCanvas');
        if(canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    // 切换模型 (回归/树)
    function switchModel(modelType) {
        if(modelType === currentModel) return;
        currentModel = modelType;
        // 更新按钮样式
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            if(btn.getAttribute('data-model') === modelType) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        // 如果当前有预测结果，重新绘制SHAP
        if (document.getElementById('resultArea').style.display === 'block' && currentPrediction.sales) {
            const features = currentModel === 'regression' ? shapFeaturesRegression : shapFeaturesTree;
            drawShapChart(features, currentModel);
        } else {
            // 没有预测结果时，也可以展示默认占位但不清爽，可以展示空canvas
            const canvas = document.getElementById('shapCanvas');
            if(canvas && !currentPrediction.sales) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#cbd5e1";
                ctx.font = "14px Inter";
                ctx.fillText("提交问卷后查看SHAP分析", 50, 100);
            }
        }
    }

    // 侧边栏折叠功能
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
        const icon = document.querySelector('#collapseBtn i');
        if(sidebar.classList.contains('collapsed')) {
            icon.classList.remove('fa-chevron-left');
            icon.classList.add('fa-chevron-right');
        } else {
            icon.classList.remove('fa-chevron-right');
            icon.classList.add('fa-chevron-left');
        }
    }

    // 图片上传预览
    function setupImageUpload() {
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('imageUpload');
        const preview = document.getElementById('previewImage');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    preview.src = ev.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        });
        // 拖拽支持简单模拟
        uploadArea.addEventListener('dragover', (e) => e.preventDefault());
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if(file && file.type.startsWith('image/')) {
                fileInput.files = e.dataTransfer.files;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    preview.src = ev.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
    }

    // 退出登录模拟
    function logout() {
        if(confirm("确认退出登录？")) {
            alert("已退出登录（演示版）");
            // 实际场景跳转登录页，这里简单重置界面
            resetSurvey();
            // 清空历史（演示）可选
            // historyData = [];
            // renderHistoryList();
        }
    }

    // 初始化界面和事件绑定
    function init() {
        renderHistoryList();
        setupImageUpload();
        document.getElementById('submitBtn').addEventListener('click', onSubmitPrediction);
        document.getElementById('newSurveyBtn').addEventListener('click', resetSurvey);
        document.getElementById('collapseBtn').addEventListener('click', toggleSidebar);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        
        // 切换按钮事件
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const model = btn.getAttribute('data-model');
                switchModel(model);
            });
        });
        
        // 默认canvas初始引导
        const canvas = document.getElementById('shapCanvas');
        if(canvas){
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#e2e8f0";
            ctx.font = "14px Inter";
            ctx.fillText("等待提交问卷生成SHAP图", 50, 100);
        }
        // 展示一条默认示例历史高亮无
    }
    
    init();
</script>
</body>
</html>
